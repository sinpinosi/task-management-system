<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow - ローカルタスク管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>Taskflow</span>
            </div>
            <div class="user-info">
                <div class="avatar" id="user-avatar">?</div>
                <div class="user-details">
                    <span class="user-name" id="user-name">Loading...</span>
                    <span class="user-role">Local User</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-board" onclick="app.setTab('board')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    ボード
                </a>
                <a href="#" class="nav-item" id="nav-my-tasks" onclick="app.setTab('my-tasks')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    マイタスク
                </a>
                <a href="#" class="nav-item" id="nav-templates" onclick="app.setTab('templates')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    テンプレート
                </a>
            </nav>
            <button class="btn-new-task" onclick="app.openModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                新規タスク
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1 id="page-title">タスク一覧</h1>
                <div class="header-actions" style="display:flex; align-items:center;">
                    <button class="btn-icon" onclick="app.loadTasks()" title="更新" id="header-btn-refresh">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l-5.6 5.6"/></svg>
                    </button>
                    <button class="btn-new-task" style="display:none; margin-left:12px;" id="header-btn-new-template" onclick="app.openTemplateModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        新規テンプレート
                    </button>
                </div>
            </header>

            <div class="tasks-board" id="tasks-board-view">
                <!-- Column headers -->
                <div class="column-headers">
                    <div class="col-task">タスク</div>
                    <div class="col-status">ステータス</div>
                    <div class="col-assignee">担当者</div>
                    <div class="col-due">期限</div>
                    <div class="col-priority">優先度</div>
                    <div class="col-actions"></div>
                </div>
                
                <!-- Task List -->
                <div class="task-list" id="task-list">
                    <!-- Tasks injected by JS -->
                    <div class="loading-state">タスクを読み込み中...</div>
                </div>
            </div>

            <!-- Templates Board View -->
            <div class="tasks-board" id="templates-board-view" style="display:none;">
                <div class="task-list" id="templates-list">
                    <!-- Templates injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Task Modal -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">タスク作成</h2>
                <button class="btn-close" onclick="app.closeModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="task-form" onsubmit="event.preventDefault(); app.saveTask();">
                    <input type="hidden" id="task-id">
                    <input type="hidden" id="parent-id">
                    
                    <div class="form-group" id="template-group" style="display:none;">
                        <label for="task-template">テンプレート</label>
                        <select id="task-template">
                            <option value="">- テンプレートなし -</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="task-title">タイトル</label>
                        <input type="text" id="task-title" required placeholder="何をしますか？">
                    </div>
                    
                    <div class="form-group">
                        <label for="task-desc">詳細</label>
                        <textarea id="task-desc" rows="3" placeholder="詳細を追加してください..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-status">ステータス</label>
                            <select id="task-status">
                                <option value="未着手">未着手 (To Do)</option>
                                <option value="進行中">進行中 (In Progress)</option>
                                <option value="レビュー依頼中">レビュー依頼中 (In Review)</option>
                                <option value="完了">完了 (Done)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="task-priority">優先度</label>
                            <select id="task-priority">
                                <option value="High">高</option>
                                <option value="Medium" selected>中</option>
                                <option value="Low">低</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-assignee">担当者</label>
                            <div style="display: flex; gap: 8px; flex-direction: column;">
                                <select id="task-assignee-select" onchange="document.getElementById('task-assignee').value = this.value">
                                    <option value="">-- 登録済みから選択 --</option>
                                </select>
                                <input type="text" id="task-assignee" placeholder="新規入力（または上記から選択）">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="task-due">期限</label>
                            <input type="date" id="task-due">
                        </div>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="app.closeModal()">キャンセル</button>
                <button class="btn-submit" onclick="app.saveTask()">保存</button>
            </div>
        </div>
    </div>

    <!-- Template Editor Modal -->
    <div class="modal-overlay" id="template-editor-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="template-modal-title">テンプレート作成</h2>
                <button class="btn-close" onclick="app.closeTemplateModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-template-id">
                <div class="form-group">
                    <label>テンプレート名</label>
                    <input type="text" id="edit-template-name" placeholder="例：ウェブサイト公開チェックリスト">
                </div>
                
                <h3 style="font-size:14px; margin-bottom:12px; margin-top:20px; color:var(--text-secondary);">テンプレートタスク</h3>
                <div id="template-tasks-container" style="display:flex; flex-direction:column; gap:12px; max-height: 400px; overflow-y:auto; overflow-x:hidden; padding-right:8px;">
                    <!-- dynamic rows -->
                </div>
                
                <button class="action-btn" style="margin-top:16px; background:rgba(99, 102, 241, 0.1); color:var(--primary-color); padding:8px 16px; border-radius:6px; font-weight:600; width:100%; border:1px dashed var(--primary-color);" onclick="app.addTemplateTaskRow()">
                    + タスク行を追加
                </button>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="app.closeTemplateModal()">キャンセル</button>
                <button class="btn-submit" onclick="app.saveTemplateBuilder()">テンプレートを保存</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>タスクを削除</h2>
                <button class="btn-close" onclick="app.closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>このタスクを削除してもよろしいですか？サブタスクもすべて削除されます。この操作は元に戻せません。</p>
                <input type="hidden" id="delete-task-id">
                <input type="hidden" id="delete-parent-id">
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="app.closeDeleteModal()">キャンセル</button>
                <button class="btn-submit btn-danger" onclick="app.confirmDelete()">削除</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
